<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">
<title>Eliza</title>
<style>
/* Layout (Bootstrap grid replacement) */
.container{max-width:1140px;padding-right:15px;padding-left:15px;margin-right:auto;margin-left:auto;}
.row::after{content:'';display:table;clear:both;}
.col-centered{box-sizing:border-box;width:66.666%;margin-left:auto;margin-right:auto;padding-left:15px;padding-right:15px;}
@media(max-width:992px){.col-centered{width:100%;}}
.text-right{text-align:right;}.text-left{text-align:left;}.text-center{text-align:center;}
/* main.css */
.chat-row{padding-top:50px;padding-bottom:120px;}
h1,h2,p{margin-top:0;margin-bottom:0;}
/* chat.css */
.chat-message-outter-wrapper{width:100%;padding-top:5px;padding-bottom:5px;}
.chat-message-icon{height:40px;display:inline-block;vertical-align:top;margin-left:4px;margin-right:4px;}
.chat-message-wrapper{max-width:80%;display:inline-block;border-radius:6px;}
.eliza-message{background-color:#F6CECE;}
.you-message{background-color:#CEECF5;}
.chat-message-text{font-size:14px;font-family:'Lato',sans-serif;padding-top:6px;padding-left:10px;padding-right:10px;}
.chat-user-text{font-size:10px;font-family:'Lato',sans-serif;padding-top:2px;padding-left:10px;padding-right:10px;padding-bottom:8px;}
/* send.css */
.send-wrapper{position:fixed;bottom:0;right:0;left:0;margin-right:auto;margin-left:auto;}
.send-inner-wrapper{padding-bottom:10px;padding-top:5px;background-color:white;border-top:1px solid #d8d8d8;}
.send-textbox{font-family:'Lato',sans-serif;font-size:16px;width:100%;min-width:100%;max-width:100%;padding:3px 4px;box-sizing:border-box;}
.send-message-help-below-text{font-family:'Source Sans Pro',sans-serif;font-size:10px;}
.send-message-help-text{font-family:'Source Sans Pro',sans-serif;font-size:14px;}
.bottom-label{padding-top:10px;font-size:12px;font-family:'Source Sans Pro',sans-serif;}
/* notifications.css */
#notification-area{position:fixed;left:15px;top:10px;width:200px;z-index:100;}
.notification-wrapper{width:100%;padding:4px 8px;border-radius:5px;margin-bottom:6px;}
.positive-notification{background-color:#D8F6CE;}
.info-notification{background-color:#F5D0A9;}
.negative-notification{background-color:#8A0808;}
.notification-text{font-family:'Lato',sans-serif;font-size:12px;}
.notification-hiding-text{font-family:'Lato',sans-serif;font-size:10px;}
.dark-text{color:#2e2e2e;}
.light-text{color:white;}
</style>
</head>
<body id="body">

<div class="container">
  <div class="row chat-row">
    <div class="col-centered">
      <span id="chat-area"></span>
    </div>
  </div>
</div>

<div class="container send-wrapper">
  <div class="row">
    <div class="col-centered send-inner-wrapper">
      <p class="send-message-help-text">Talk to Eliza by typing into the textbox below:</p>
      <input type="text" class="send-textbox" />
      <p class="send-message-help-below-text text-right">Send your message by pressing &ldquo;Enter&rdquo;</p>
      <p class="bottom-label text-center">Chris Berg &middot; ECON1626 &middot; Based on <a href="https://github.com/kweaver00/eliza" target="_blank">keithweaver/eliza</a> &middot; Original ELIZA by Joseph Weizenbaum (1966)</p>
    </div>
  </div>
</div>

<span id="notification-area"></span>

	"another language" : { "weight" : 1, "responses" : ["I told you before, I don't understand languages that are not English."]},
	"computer" : { "weight" : 12, "responses" : ["Do computers worry you?","Why do you mention computers?","Could you expand on how computers and * are related?","What do you think machines have to do with your problem?","Don't you think computers can help people?","What about machines worrys you?","What do you think about machines?"]},
	"are you" : { "weight" : 2, "responses" : ["Why are you interested in whether I am * or not?","Would you prefer if I weren't *?","Perhaps I am * in your fantasies.","Do you sometimes think I am *?"]},
	"are" : { "weight" : 1, "responses" : ["Did you think they might not be *?","Would you like it if they were not *?","What if they were not *?","Possibly they are *."]},
	"your" : { "weight" : 1, "responses" : ["Why are you concerned over my *?","What about your own *?","Are you worried about someone else's *?","Really, my *?"]},
	"was i" : { "weight" : 2, "responses" : ["What if you were *?","Do you think you were *?","Were you *?","What would it mean if you were *?","What does * suggest to you?"]},
	"was you" : { "weight" : 2, "responses" : ["Would you like to believe I was *?","What suggests that I was *?","What do you think?"]},
	"i desire" : { "weight" : 1, "responses" : ["What would it mean to you if you got it?","Why do you want it?","What if you never got it?"]},
	"i desired" : { "weight" : 1, "responses" : ["Did you achieve it or simply moved on?"]},
	"i am sad" : { "weight" : 1, "responses" : ["Sorry to hear you are. Tell me about it."]},
	"i am happy" : { "weight" : 1, "responses" : ["That's good. What is making you happy?"]},
	"i am bored" : { "weight" : 1, "responses" : ["What makes you bored?"]}
};

var synonyms = {
	"sorry" : ["apologise"],
	"another language" : ["deutsch","francais","french","italiano","italian","espanol","spanish","xforeign"],
	"dreamed" : ["dream","dreams"],
	"i am" : ["am i","im","i'm"],
	"you" : ["you're","you are"],
	"was i" : ["i was"]
};

var responsesWithWildcard = {
	"i am *1-3* happy" : { weight : 20, replacementWord : "i am happy" },
	"i am *1-3* sad"   : { weight : 20, replacementWord : "i am sad" },
	"i am *1-3* bored" : { weight : 20, replacementWord : "i am bored" }
};

var initialMessages = ["Hello. How are you feeling today?"];
var endChatTerms = ["goodbye","I have to leave","I have to leave.","quit","bye","exit"];
var chatHistory = [];
var keywords = [];
var conversationOver = false;
var usedResponses = [];

function startElizaChat(){
	getKeywordsByWeight();
	var initialMessage = initialMessages[Math.floor(Math.random()*initialMessages.length)];
	chatHistory.push({ isEliza : true, content : initialMessage });
	displayChat();
}

function getKeywordsByWeight(){
	var weights = [];
	var tempKeywords = [];
	for(var responseKeyword in responses){
		var weight = responses[responseKeyword].weight;
		tempKeywords[responseKeyword] = weight;
		if(!weights.includes(weight)){ weights.push(weight); }
	}
	for(var wordWithResponse in synonyms){
		if(wordWithResponse in tempKeywords){
			var weight = tempKeywords[wordWithResponse];
			for(var i = 0;i < synonyms[wordWithResponse].length;i++){
				tempKeywords[synonyms[wordWithResponse][i]] = weight;
			}
		}
	}
	for(var word in responsesWithWildcard){
		var weight = responsesWithWildcard[word].weight;
		if(!weights.includes(weight)){ weights.push(weight); }
		tempKeywords[word] = weight;
	}
	weights = weights.sort(sortNumber);
	for(var i = 0;i < weights.length;i++){
		var weight = weights[i];
		for(var word in tempKeywords){
			if(tempKeywords[word] === weight && word != "NOTFOUND"){
				keywords.push({ word : word, weight : weight });
			}
		}
	}
}

function sendElizaNewMessage(newMessage){
	chatHistory.push({ isEliza : false, content : newMessage });
	displayChat();
	clearSendTextbox();
	var response;
	if(!conversationOver){
		newMessage = processInput(newMessage);
		response = analyze(newMessage);
	}else{
		response = "Our conversation has ended. Refresh the page to start again.";
	}
	setTimeout(function(){
		usedResponses.push(response);
		chatHistory.push({ isEliza : true, content : response });
		displayChat();
	}, determineResponseTime());
}

function analyze(newMessage){
	var found = false;
	var response = '';
	for(var i = 0;i < keywords.length;i++){
		var word = keywords[i].word;
		if(endChatTerms.contains(newMessage)){
			conversationOver = true;
			newMessage = "goodbye";
		}
		if(word.indexOf("*") != -1 && containsKeywordWithWildcard(newMessage, word) && !found){
			response = selectResponse(findBasicKeywordFromKeywordWithWildcard(word));
			found = true;
		}else if((newMessage.indexOf(word) != -1 && newMessage.length == word.length || newMessage.indexOf(word + " ") != -1 || newMessage.indexOf(" " + word) != -1) && !found){
			response = selectResponse(word);
			found = true;
		}
		if(found && response.indexOf("*") !== -1){
			var remainingInput = newMessage.substring(newMessage.indexOf(word) + word.length + 1, newMessage.length);
			var rightOfWildcardInResponse = response.substring(response.indexOf("*") + 1);
			var startOfResponseToWildcard = response.substring(0, response.indexOf("*"));
			var startOfInputMinusOneCharacter = remainingInput.substring(0, remainingInput.length - 1);
			var remainingOfInputOnRight = remainingInput.substring(remainingInput.length - 1, remainingInput.length).replace("[^A-Za-z]","");
			response = startOfResponseToWildcard + replaceWords(startOfInputMinusOneCharacter + remainingOfInputOnRight) + rightOfWildcardInResponse;
		}
		if(found){ break; }
	}
	if(!found){
		response = responses["NOTFOUND"].responses[Math.floor(Math.random()*responses["NOTFOUND"].responses.length)];
	}
	return response;
}

function selectResponse(word){
	var potentialResponses;
	if(word in responses){
		potentialResponses = responses[word];
	}else{
		potentialResponses = findResponsesForSimilarWord(word);
	}
	var newResponses = [];
	var originalResponsesSize = potentialResponses.responses.length;
	for(var i = 0;i < originalResponsesSize;i++){
		newResponses.push(potentialResponses.responses[i]);
		if(potentialResponses.responses[i].indexOf("*") !== -1){ newResponses.push(potentialResponses.responses[i]); }
		if(!usedResponses.contains(potentialResponses.responses[i])){ newResponses.push(potentialResponses.responses[i]); }
	}
	return newResponses[Math.floor(Math.random()*newResponses.length)];
}

function processInput(message){
	message = message.toLowerCase();
	message = removePunctuation(message);
	return message;
}

function replaceWords(input){
	var wordsForReplacement = [];
	wordsForReplacement["i"] = "you";
	wordsForReplacement["you"] = "i";
	wordsForReplacement["me"] = "you";
	wordsForReplacement["my"] = "your";
	wordsForReplacement["am"] = "are";
	wordsForReplacement["are"] = "am";
	wordsForReplacement["was"] = "were";
	wordsForReplacement["i'd"] = "you would";
	wordsForReplacement["i've"] = "you have";
	wordsForReplacement["i'll"] = "you will";
	wordsForReplacement["you've"] = "i have";
	wordsForReplacement["you'll"] = "i will";
	wordsForReplacement["your"] = "my";
	wordsForReplacement["yours"] = "mine";
	wordsForReplacement["always had"] = "always have";
	var inputSplit = input.split(" ");
	var newSplit = [];
	for(var i = 0;i < inputSplit.length;i++){
		var w = inputSplit[i];
		newSplit[i] = (w in wordsForReplacement) ? wordsForReplacement[w] : w;
	}
	return newSplit.join(" ");
}

function removePunctuation(message){
	message = message.replace(",","");
	message = message.replace(";","");
	message = message.replace(".","");
	message = message.replace("?","");
	message = message.replace("!","");
	message = message.replace(":","");
	return message;
}

function determineResponseTime(){
	return Math.floor(Math.random() * 2000) + 500;
}

function sortNumber(a,b){ return b - a; }

function findResponsesForSimilarWord(word){
	var foundKey = "";
	for(var key in synonyms){
		var similarWords = synonyms[key];
		for(var i = 0;i < similarWords.length;i++){
			if(similarWords[i] == word){ foundKey = key; break; }
		}
		if(foundKey != ""){ break; }
	}
	return responses[foundKey];
}

function containsKeywordWithWildcard(input, keywordsWithWildcardStr){
	var responseWildcardObj = getResponseWildcardInfo(keywordsWithWildcardStr);
	var numberOfWordsInWildcard = 0;
	var foundKeywords = 0;
	var inputArray = input.split(" ");
	for(var i = 0;i < inputArray.length;i++){
		var currentWord = inputArray[i];
		if((foundKeywords >= responseWildcardObj.minNumWords && foundKeywords <= responseWildcardObj.maxNumWords) && !responseWildcardObj.keywords.contains(currentWord)){
			numberOfWordsInWildcard++;
		}
		if(responseWildcardObj.keywords.length > 0 && currentWord == responseWildcardObj.keywords[0]){
			responseWildcardObj.keywords.remove(currentWord);
			foundKeywords++;
		}
	}
	if(responseWildcardObj.keywords.length > 0){ return false; }
	if(!(numberOfWordsInWildcard >= responseWildcardObj.minNumWords && numberOfWordsInWildcard <= responseWildcardObj.maxNumWords)){ return false; }
	return true;
}

function findBasicKeywordFromKeywordWithWildcard(keywordsWithWildcardStr){
	return responsesWithWildcard[keywordsWithWildcardStr].replacementWord;
}

function getResponseWildcardInfo(keywordsWithWildcardStr){
	var keywordsWithWildcard = keywordsWithWildcardStr.split(" ");
	var rulesInSingleStr = "";
	var positionOfWordAfterOfWildcard = 0;
	for(var i = 0;i < keywordsWithWildcard.length;i++){
		positionOfWordAfterOfWildcard = i;
		if(keywordsWithWildcard[i].indexOf("*") != -1){ rulesInSingleStr = keywordsWithWildcard[i]; break; }
	}
	var positionOfWordBeforeOfWildcard = positionOfWordAfterOfWildcard - 1;
	keywordsWithWildcard = keywordsWithWildcard.remove(rulesInSingleStr);
	rulesInSingleStr = rulesInSingleStr.replace("*","").replace("*","");
	if(rulesInSingleStr.length < 3){ return false; }
	return {
		minNumWords : rulesInSingleStr.substring(0,1),
		maxNumWords : rulesInSingleStr.substring(2),
		wordBeforeWildcard : positionOfWordBeforeOfWildcard,
		wordAfterWildcard : positionOfWordAfterOfWildcard,
		keywords : keywordsWithWildcard
	};
}

Array.prototype.remove = function(needle){
	var index = this.indexOf(needle);
	if(index > -1){ this.splice(index, 1); }
	return this;
};

Array.prototype.contains = function(needle){
	for(var i in this){ if(this[i] == needle) return true; }
	return false;
};

	var html = '';

		startElizaChat();
	}else{
		for(var i = 0;i < chatHistory.length;i++){
			var msg = chatHistory[i];
			html += msg.isEliza ? getElizaMessageHTML(msg.content) : getUserMessageHTML(msg.content);
		}
		document.getElementById('chat-area').innerHTML = html;
	}
	var bodyEl = document.getElementById('body');
	bodyEl.scrollTop = bodyEl.scrollHeight;

// === notifications.js (jQuery replaced with vanilla JS) ===
var currentNotifications = [];

document.addEventListener('DOMContentLoaded', function(){
	setTimeout(function(){ createInfoNotification('Run the demo by sending "run demo1"', 9); }, 1000);
	setTimeout(function(){ createInfoNotification('Run the demo by sending "run demo2"', 9); }, 2000);
	setTimeout(function(){ createInfoNotification('If you like this project, please go star it!', 6); }, 3000);
	setInterval(function(){
		if(currentNotifications.length > 0){ refershNotifications(); }
	}, 1000);
});

function createInfoNotification(message, seconds){ createNotification(message, "info", seconds); }
function createNegativeNotification(message, seconds){ createNotification(message, "negative", seconds); }
function createPositiveNotification(message, seconds){ createNotification(message, "positive", seconds); }

function createNotification(message, type, seconds){
	currentNotifications.push({ message : message, cyclesRemaining : seconds, type : type });
	var typeClass = "", typeText = "";
	if(type == "positive"){ typeClass = "positive-notification"; typeText = "dark-text"; }
	else if(type == "negative"){ typeClass = "negative-notification"; typeText = "light-text"; }
	else{ typeClass = "info-notification"; typeText = "dark-text"; }
	document.getElementById('notification-area').insertAdjacentHTML('beforeend',
		'<div class="notification-wrapper ' + typeClass + '"><p class="notification-text ' + typeText + '">' + message + '</p></div>'
	);
}

function refershNotifications(){
	var html = '';
	for(var i = 0;i < currentNotifications.length;i++){
		var n = currentNotifications[i];
		var typeClass = "", typeText = "";
		if(n.type == "positive"){ typeClass = "positive-notification"; typeText = "dark-text"; }
		else if(n.type == "negative"){ typeClass = "negative-notification"; typeText = "light-text"; }
		else{ typeClass = "info-notification"; typeText = "dark-text"; }
		if(n.cyclesRemaining > 0){
			n.cyclesRemaining--;
			html += '<div class="notification-wrapper ' + typeClass + '"><p class="notification-text ' + typeText + '">' + n.message + '</p></div>';
		}
	}
	document.getElementById('notification-area').innerHTML = html;
}
